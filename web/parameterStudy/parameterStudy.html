<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Moon | Parameter Study</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="stars"></div>
    <div class="twinkling"></div>
    
    <div class="container">
        <header>
            <h1>PROJECT MOON - Parameter Study</h1>
            <p class="subtitle">Analyze sensitivity of gyrosynchrotron emission to parameter variations</p>
        </header>

        <main>
            <section class="control-panel">
                <div class="panel-header">
                    <h2>Observation</h2>
                </div>

                <form id="gsyncForm">
                    <div class="button-group secondary">
                        <button type="button" id="importJsonBtn" class="json-btn">IMPORT SETTINGS (JSON)</button>
                        <button type="button" id="fillExampleBtn" class="json-btn">FILL WITH AN EXAMPLE</button>
                        <input type="file" id="jsonFile" accept=".json" class="hidden">
                    </div>

                    <!-- Environment Section (Middle) -->
                    <div class="params-section">
                        <div class="section-header">
                            <h3>Environment Settings</h3>
                        </div>
                        <div class="grid-layout">
                            <div class="input-group">
                                <label for="viewAngle">View Angle (deg)</label>
                                <input type="number" id="viewAngle" step="any" value="" required>
                            </div>
                            <div class="input-group">
                                <label for="height">Source Height [cm]</label>
                                <input type="number" id="height" step="any" value="" required>
                            </div>
                            <div class="input-group">
                                <label for="emin">Emin [MeV]</label>
                                <input type="number" id="emin" step="any" value="" required>
                            </div>
                            <div class="input-group">
                                <label for="emax">Emax [MeV]</label>
                                <input type="number" id="emax" step="any" value="" required>
                            </div>
                            <div class="input-group">
                                <label for="etr">ETR</label>
                                <label class ="disclaimer" for="etr">gyro/sync transition energy [MeV]</label>

                                <input type="number" id="etr" step="any" value="" required>
                            </div>
                            <div class="input-group">
                                <label for="np">Plasma density [cm^-3]</label>
                                <input type="number" id="np" step="any" value="" required>
                            </div>
                        </div>
                    </div>

                    <!-- Parameter Study Section (Bottom) -->
                    <div class="params-section">
                        <div class="section-header">
                            <h3>Parameter Study</h3>
                        </div>
                        <div class="params-grid">
                            <!-- Delta -->
                            <div class="param-row" id="delta_row">
                                <div class="param-select" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                                    <span class="param-name">Delta</span>
                                    <label class="switch">
                                        <input type="radio" id="delta_select" name="study_param" value="delta" checked>
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <input type="number" id="delta_val_1" step="any" placeholder="Val 1" class="study-input">
                                <input type="number" id="delta_val_2" step="any" placeholder="Val 2" class="study-input">
                                <input type="number" id="delta_val_3" step="any" placeholder="Val 3" class="study-input hidden">
                                <input type="number" id="delta_val_4" step="any" placeholder="Val 4" class="study-input hidden">
                            </div>
                            
                            <!-- nelectron -->
                            <div class="param-row" id="nelectron_row">
                                <div class="param-select" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                                    <span class="param-name">nelectron</span>
                                    <label class="switch">
                                        <input type="radio" id="nelectron_select" name="study_param" value="nelectron">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <input type="number" id="nelectron_val_1" step="any" placeholder="Val 1" class="study-input">
                                <input type="number" id="nelectron_val_2" step="any" placeholder="Val 2" class="study-input hidden">
                                <input type="number" id="nelectron_val_3" step="any" placeholder="Val 3" class="study-input hidden">
                                <input type="number" id="nelectron_val_4" step="any" placeholder="Val 4" class="study-input hidden">
                            </div>
                    
                            <!-- bmag -->
                            <div class="param-row" id="bmag_row">
                                <div class="param-select" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                                    <span class="param-name">bmag</span>
                                    <label class="switch">
                                        <input type="radio" id="bmag_select" name="study_param" value="bmag">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <input type="number" id="bmag_val_1" step="any" placeholder="Val 1" class="study-input">
                                <input type="number" id="bmag_val_2" step="any" placeholder="Val 2" class="study-input hidden">
                                <input type="number" id="bmag_val_3" step="any" placeholder="Val 3" class="study-input hidden">
                                <input type="number" id="bmag_val_4" step="any" placeholder="Val 4" class="study-input hidden">
                            </div>
                    
                            <!-- asize -->
                            <div class="param-row" id="asize_row">
                                <div class="param-select" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                                    <span class="param-name">asize</span>
                                    <label class="switch">
                                        <input type="radio" id="asize_select" name="study_param" value="asize">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <input type="number" id="asize_val_1" step="any" placeholder="Val 1" class="study-input">
                                <input type="number" id="asize_val_2" step="any" placeholder="Val 2" class="study-input hidden">
                                <input type="number" id="asize_val_3" step="any" placeholder="Val 3" class="study-input hidden">
                                <input type="number" id="asize_val_4" step="any" placeholder="Val 4" class="study-input hidden">
                            </div>
                        </div>
                    </div>

                    <div class="button-group">
                        <button type="submit" id="runBtn" data-endpoint="/parameterImpact">RUN PARAMETER STUDY</button>
                    </div>
                </form>
            </section>

            <section class="results-panel hidden" id="resultsPanel">
                <div class="panel-header">
                    <h2>Simulation Results</h2>
                    <div class="results-actions">
                        <button type="button" id="exportJsonBtn" class="json-btn" style="padding: 0.5rem 1rem; flex: 0 0 auto;">EXPORT SETTINGS (JSON)</button>
                    </div>
                </div>
                <div class="results-content">
                    <div class="view-toggle" aria-label="Result view selector">
                        <button type="button" class="view-toggle-btn active" data-view="chart">Graph</button>
                        <button type="button" class="view-toggle-btn" data-view="image">Image</button>
                    </div>
                    <div class="chart-container chart-container--interactive" data-result-view="chart">
                        <h3>Spectrum Chart</h3>
                        <canvas id="resultChart" aria-label="Interactive spectrum chart"></canvas>
                    </div>
                    <div class="chart-container hidden" data-result-view="image">
                        <h3>Chart Image</h3>
                        <img id="resultImage" src="" alt="Simulation Plot">
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="loader" class="loader hidden">
        <div class="moon"></div>
        <p>Calculating Trajectory...</p>
    </div>

    <div class="footer">
        <p>Created by <a href="https://faganello.dev.br" target="_blank" rel="noopener noreferrer">Bruno Faganello</a></p>
    </div>

    <script src="../config.js"></script>
    <script src="script.js"></script>
</body>
</html>
