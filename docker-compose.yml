version: '3.8'

services:
  backend:
    image: faganello60/project-moon-backend:local
    build: .
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: faganello60/project-moon-frontend:local
    build: ./web
    environment:
      API_BASE_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
